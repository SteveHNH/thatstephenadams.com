baseURL = "https://www.thatstephenadams.com/"
defaultContentLanguage = "en"
title = "Stephen Adams"
theme = "mana"

[pagination]
  pageSize = 10

[outputs]
  # RSS keeps the existing /index.xml feed; JSON builds /index.json, the
  # full-text search index the theme reads.
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    # posts and podcast episodes embed raw <iframe> / <img> HTML
    unsafe = true
  [markup.goldmark.parser.attribute]
    # required for the theme's blockquote / admonition render hook
    block = true
    title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 5
    ordered = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    # false: use the CSS classes the theme ships (syntax-dark.css / syntax-light.css)
    noClasses = false
    style = "catppuccin-macchiato"

[params]
  description = "It's about the journey"
  author = "Stephen Adams"
  heroTitleLine1 = "Stephen Adams"
  heroTitleLine2 = "It's about the journey"
  # Line shown under the hero title on the home page (see layouts/_default/home.html).
  # Kept separate from `description` so the site-wide meta description is unaffected.
  heroSubtitle = "podcaster. streamer. nerd."
  relatedPostsCount = 3
  enableIntegrity = false

  # Point every favicon slot at the existing static/img/avatar.png. Replace with a
  # generated favicon set (static/favicon/*) when there's time; the theme's
  # partials/head/favicon.html reads these keys.
  [params.favicons]
    ico = "/img/avatar.png"
    png = "/img/avatar.png"
    png16 = "/img/avatar.png"
    png32 = "/img/avatar.png"
    apple180 = "/img/avatar.png"
    android192 = "/img/avatar.png"
    android512 = "/img/avatar.png"

  [params.avatar.home]
    url = "/img/avatar.png"
  [params.avatar.about]
    url = "/img/avatar.png"

  [params.social]
    github = "https://github.com/stevehnh"
    # bluesky and youtube are rendered by layouts/partials/social-links.html (repo override)
    bluesky = "https://bsky.app/profile/thatstephenadams.com"
    youtube = "https://www.youtube.com/@2dorkstv"

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2021
    owner = "Stephen Adams"

  [params.admonitions]
    alertStyle = "favicon"

  [params.buyMeACoffee]
    enabled = false

[[menus.main]]
  name = "Blog"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Posts"
  pageRef = "/post"
  weight = 20

[[menus.main]]
  name = "Podcasts"
  pageRef = "/page/podcasts"
  weight = 30

[[menus.main]]
  name = "How I Work"
  pageRef = "/page/how-i-work"
  weight = 40

[[menus.main]]
  name = "Life Rules"
  pageRef = "/page/life-rules"
  weight = 50

[[menus.main]]
  name = "Archive"
  pageRef = "/archive"
  weight = 60

[[menus.main]]
  name = "Old Blog"
  url = "https://www.2dsteve.com"
  weight = 100
